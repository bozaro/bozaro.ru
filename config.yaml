theme: hugo-geo
paginate: 10
enableGitInfo: true
params:
  # Render the rotating globe in the sidebar
  showglobe: true

  # Google Analytics
  analytics: "UA-8091129-1"
  metrika: 792360

  # Sidebar profile picture
  profilepic: "img/bozaro.jpg"
  favicon: "img/favicon.png"
  css:
  - "/css/bozaro.css"

  # Social buttons for sidebar
  email: "bozaro@yandex.ru"
  socialbuttons:
  - faicon: "linkedin"
    url: "https://linkedin.com/in/bozaro"

  - faicon: "github"
    url: "https://github.com/bozaro"

  navlinks:
  - name: Blog
    url: ""

indexes:
  tag: "tags"

permalinks:
  post: /:year/:month/:day/:slug/

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: vs

languages:
  ru:
    baseURL: "https://bozaro.ru/"
    label: Русский
    title: Bozaro. Экспериментариум
    weight: 1
    services:
      disqus:
        shortname: "http-www-bozaro-ru"
    params:
      subtitle: "Артем В. Навроцкий"
      header: "Экспериментариум"
  en:
    baseURL: "https://bozaro.me/"
    label: English
    title: Bozaro. Experimentarium
    weight: 2
    services:
      disqus:
        shortname: "bozaro-me"
    params:
      subtitle: "Artem V. Navrotskiy"
      header: "Experimentarium"

relativeURLs: true
disable404: true
metadataFormat: "yaml"
enableRobotsTXT: true
